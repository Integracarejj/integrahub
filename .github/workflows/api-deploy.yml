name: Validate and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-and-api:
    name: Frontend and API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Run frontend unit tests
        run: npm test

      - name: Run API tests
        run: npm test --prefix api

  browser-e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright regression suite
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-typecheck:
    name: TypeScript and production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc -b

      - name: Production build
        run: npm run build

  deploy:
    needs: [unit-and-api, browser-e2e, build-typecheck]
    if: github.event_name != 'pull_request' && success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deployment folder
        run: |
          mkdir -p deploy
          cp api/package.json deploy/
          cp api/package-lock.json deploy/
          cp api/src/server.js deploy/server.js
          cp -r api/src deploy/src
          cp -r api/dist deploy/

      - name: Create deployment package
        run: cd deploy && zip -r ../deploy.zip .

      - uses: azure/webapps-deploy@v3
        with:
          app-name: Integrasource
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
