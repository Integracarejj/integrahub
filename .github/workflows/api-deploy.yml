name: Validate and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression suite
        run: npm run test:e2e

      - name: Run unit tests
        run: npm test

      - name: TypeScript validation
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deployment folder
        run: |
          mkdir -p deploy
          cp api/package.json deploy/
          cp api/package-lock.json deploy/
          cp api/src/server.js deploy/server.js
          cp -r api/src deploy/src
          cp -r api/dist deploy/

      - name: Create deployment package
        run: cd deploy && zip -r ../deploy.zip .

      - uses: azure/webapps-deploy@v3
        with:
          app-name: Integrasource
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
